<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Git2Live sample site</title>
  <style>
    :root { color-scheme: light dark; --bg: #f6f7fb; --fg: #1b1e2b; --muted: #5d6275; --accent: #4b54d8; }
    @media (prefers-color-scheme: dark) { :root { --bg: #11131c; --fg: #e8e9f1; --muted: #9ca0b3; --accent: #9aa1ff; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
           font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 36rem; padding: 32px 16px; }
    h1 { font-size: 32px; line-height: 1.2; margin: 0 0 8px; }
    p { color: var(--muted); }
    code { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>It's live.</h1>
    <p>This static page is the integration-test project for <strong>Git2Live</strong>.
       If you can read this, the provider built and served it from its real public URL.</p>
    <p>Served at <code id="where"></code></p>
  </main>
  <script>document.getElementById('where').textContent = location.href;</script>
</body>
</html>
